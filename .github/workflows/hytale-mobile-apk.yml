name: Build Hytale Mobile APK

on:
  push:
    branches: [main]
    paths:
      - 'hytale-mobile/**'
      - '.github/workflows/hytale-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: hytale-mobile
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp hytale-mobile/app/build/outputs/apk/debug/app-debug.apk Hytale-Mobile-v0.4-alpha.apk
          sha256sum Hytale-Mobile-v0.4-alpha.apk > Hytale-Mobile-v0.4-alpha.sha256.txt
          ls -lh Hytale-Mobile-v0.4-alpha.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hytale-Mobile-v0.4-alpha
          path: |
            Hytale-Mobile-v0.4-alpha.apk
            Hytale-Mobile-v0.4-alpha.sha256.txt
          if-no-files-found: error
          compression-level: 0
