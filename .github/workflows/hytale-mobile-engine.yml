name: Build Hytale Mobile Engine APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hytale-mobile-engine.yml'
      - 'hytale-mobile-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Hytale Mobile overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator engine
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: 3af528875c19d6e378e81ba28b09023840973a1f
          path: engine
          fetch-depth: 1
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Apply Hytale Mobile overlay
        shell: bash
        run: |
          set -euo pipefail

          sed -i "s/applicationId 'com.winlator'/applicationId 'com.unofficial.hytalemobile'/" engine/app/build.gradle
          sed -i 's/versionCode 32/versionCode 7/' engine/app/build.gradle
          sed -i 's/versionName "11.2"/versionName "0.7.0-alpha"/' engine/app/build.gradle

          while IFS= read -r -d '' file; do
            sed -i \
              -e 's#/data/data/com\.winlator#/data/data/com.unofficial.hytalemobile#g' \
              -e 's#/data/user/0/com\.winlator#/data/user/0/com.unofficial.hytalemobile#g' \
              "$file"
          done < <(grep -RIlZ -E '/data/(data|user/0)/com\.winlator' engine/app/src || true)

          sed -i 's/com\.winlator\.FileProvider/com.unofficial.hytalemobile.FileProvider/g' \
            engine/app/src/main/AndroidManifest.xml \
            engine/app/src/main/java/com/winlator/core/FileUtils.java

          cp hytale-mobile-engine/HytaleMobileActivity.java \
            engine/app/src/main/java/com/winlator/HytaleMobileActivity.java

          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/app/src/main/java/com/winlator/HytaleMobileActivity.java')
          s = p.read_text()
          old = '        intent.putExtra("exec_path", client.getAbsolutePath());\n        startActivity(intent);'
          new = '        intent.putExtra("exec_path", client.getAbsolutePath());\n        intent.putExtra("controls_profile_id", 77);\n        startActivity(intent);'
          if old not in s:
              raise SystemExit('Hytale launch insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY

          cp hytale-mobile-engine/controls-77.icp \
            engine/app/src/main/assets/inputcontrols/profiles/controls-77.icp

          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needle = '        <activity android:name="com.winlator.MainActivity"\n'
          if needle not in s:
              raise SystemExit('MainActivity launcher entry not found')
          s = s.replace(needle, '        <activity android:name="com.winlator.HytaleMobileActivity"\n', 1)
          marker = '        <activity android:name="com.winlator.XServerDisplayActivity"\n'
          advanced = '''        <activity android:name="com.winlator.MainActivity"\n            android:theme="@style/AppThemeDark"\n            android:exported="false"\n            android:screenOrientation="sensor"\n            android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|smallestScreenSize|density|navigation" />\n\n'''
          if marker not in s:
              raise SystemExit('XServer activity marker not found')
          p.write_text(s.replace(marker, advanced + marker, 1))

          p = Path('engine/app/src/main/java/com/winlator/XServerDisplayActivity.java')
          s = p.read_text()
          old = '''        if (shortcut != null) {\n            String controlsProfile = shortcut.getExtra("controlsProfile");\n            if (!controlsProfile.isEmpty()) {\n                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));\n                if (profile != null) showInputControls(profile);\n            }\n        }\n'''
          new = '''        if (shortcut != null) {\n            String controlsProfile = shortcut.getExtra("controlsProfile");\n            if (!controlsProfile.isEmpty()) {\n                ControlsProfile profile = inputControlsManager.getProfile(Integer.parseInt(controlsProfile));\n                if (profile != null) showInputControls(profile);\n            }\n        }\n        else {\n            int controlsProfileId = getIntent().getIntExtra("controls_profile_id", 0);\n            if (controlsProfileId > 0) {\n                ControlsProfile profile = inputControlsManager.getProfile(controlsProfileId);\n                if (profile != null) showInputControls(profile);\n            }\n        }\n'''
          if old not in s:
              raise SystemExit('Controls profile insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY

          while IFS= read -r -d '' file; do
            sed -i -E 's#<string name="app_name">[^<]*</string>#<string name="app_name">Hytale Mobile (Unofficial)</string>#' "$file"
          done < <(find engine/app/src/main/res -name strings.xml -print0)

          mkdir -p engine/app/src/main/assets/licenses
          cp engine/LICENSE engine/app/src/main/assets/licenses/WINLATOR-LGPL-2.1.txt
          cat > engine/app/src/main/assets/licenses/HYTALE-MOBILE-NOTICE.txt <<'EOF'
          Hytale Mobile (Unofficial) - engine alpha 0.7

          This is an unofficial community compatibility project. It is not
          affiliated with or endorsed by Hypixel Studios or the Hytale rights
          holders. The APK does not contain Hytale game files.

          Runtime foundation: Winlator by BrunoSX / brunodev85.
          Upstream source: https://github.com/brunodev85/winlator-app
          Pinned upstream commit: 3af528875c19d6e378e81ba28b09023840973a1f
          Winlator is distributed under GNU LGPL-2.1; its license is bundled
          next to this notice. Hytale Mobile's launcher and touch profile are
          independent overlay code published in this repository.

          Winlator itself incorporates or interfaces with Wine, Box64, Mesa,
          DXVK and other components. Their respective licenses continue to apply.
          EOF

          echo '=== Hytale Mobile 0.7 verification ==='
          grep -n "applicationId\|versionCode\|versionName" engine/app/build.gradle
          grep -n "HytaleMobileActivity\|com.unofficial.hytalemobile.FileProvider" engine/app/src/main/AndroidManifest.xml
          grep -n 'controls_profile_id' engine/app/src/main/java/com/winlator/HytaleMobileActivity.java engine/app/src/main/java/com/winlator/XServerDisplayActivity.java
          test -s engine/app/src/main/assets/inputcontrols/profiles/controls-77.icp
          grep -R "/data/data/com.winlator\|/data/user/0/com.winlator" engine/app/src && {
            echo 'ERROR: stale absolute com.winlator app-data path found'; exit 1;
          } || true

      - name: Build real runtime APK
        working-directory: engine
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify runtime payload
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find engine/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          unzip -l "$APK" > apk-files.txt
          grep -q 'assets/rootfs.tzst' apk-files.txt
          grep -q 'assets/box64/box64-' apk-files.txt
          grep -q 'lib/arm64-v8a/libwinlator.so' apk-files.txt
          grep -q 'assets/dxwrapper/dxvk-' apk-files.txt
          grep -q 'assets/inputcontrols/profiles/controls-77.icp' apk-files.txt
          echo 'Verified: RootFS + Box64 + native runtime + DXVK + Hytale touch controls.'

      - name: Prepare Hytale Mobile Engine artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find engine/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" Hytale-Mobile-v0.7-engine-alpha.apk
          sha256sum Hytale-Mobile-v0.7-engine-alpha.apk > Hytale-Mobile-v0.7-engine-alpha.sha256.txt
          printf '%s\n' \
            'Hytale Mobile v0.7 Engine Alpha' \
            'Runtime foundation: Winlator source pinned at 3af528875c19d6e378e81ba28b09023840973a1f.' \
            'Includes real Wine + Box64 + RootFS + graphics compatibility runtime.' \
            'Dedicated launcher creates a Hytale container, imports user-owned game files into C:\\Hytale and launches HytaleClient.exe through XServerDisplayActivity.' \
            'Includes a dedicated editable Hytale touch profile: WASD stick, look touch area, jump, attack, use, inventory, sprint, crouch, chat, escape and hotbar 1-9.' \
            'No Hytale files are distributed. Physical-device game compatibility still requires a real-device test.' \
            > Hytale-Mobile-v0.7-engine-alpha-NOTICE.txt
          ls -lh Hytale-Mobile-v0.7-engine-alpha.apk
          cat Hytale-Mobile-v0.7-engine-alpha.sha256.txt

      - name: Upload engine APK
        uses: actions/upload-artifact@v4
        with:
          name: Hytale-Mobile-v0.7-engine-alpha
          path: |
            Hytale-Mobile-v0.7-engine-alpha.apk
            Hytale-Mobile-v0.7-engine-alpha.sha256.txt
            Hytale-Mobile-v0.7-engine-alpha-NOTICE.txt
          if-no-files-found: error
          compression-level: 0
