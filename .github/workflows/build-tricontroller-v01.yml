name: Build TriConsole Virtual Controller v0.1 APK

on:
  push:
    branches: [build-tricontroller-v0.1]
    paths:
      - '.github/workflows/build-tricontroller-v01.yml'
      - 'build-input/tricontroller-v0.1-source.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-out
          base64 -d build-input/tricontroller-v0.1-source.b64 > build-out/source.zip
          unzip -q build-out/source.zip -d build-out/project
          test -f build-out/project/TriConsole-Virtual-Controller-v0.1-alpha/settings.gradle

      - name: Build debug APK
        working-directory: build-out/project/TriConsole-Virtual-Controller-v0.1-alpha
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build-out/project/TriConsole-Virtual-Controller-v0.1-alpha/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" TriConsole-Virtual-Controller-v0.1-alpha.apk
          sha256sum TriConsole-Virtual-Controller-v0.1-alpha.apk > TriConsole-Virtual-Controller-v0.1-alpha.sha256.txt
          file TriConsole-Virtual-Controller-v0.1-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TriConsole-Virtual-Controller-v0.1-alpha
          path: |
            TriConsole-Virtual-Controller-v0.1-alpha.apk
            TriConsole-Virtual-Controller-v0.1-alpha.sha256.txt
          if-no-files-found: error
          compression-level: 0
