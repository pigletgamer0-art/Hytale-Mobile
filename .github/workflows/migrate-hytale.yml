name: Migrate Hytale Mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-hytale.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hytale Mobile repository
        uses: actions/checkout@v4

      - name: Fetch Hytale Mobile sources from old branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hytale-source
          git clone --depth 1 --branch hytale-mobile \
            'https://github.com/pigletgamer0-art/better-xcloud-desktop..git' \
            /tmp/hytale-source

      - name: Copy Hytale Mobile project only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hytale-mobile hytale-mobile-engine
          cp -a /tmp/hytale-source/hytale-mobile ./hytale-mobile
          cp -a /tmp/hytale-source/hytale-mobile-engine ./hytale-mobile-engine

          cat > README.md <<'EOF'
          # Hytale Mobile

          Unofficial community experiment for running a user-provided Hytale Windows client on Android.

          This repository contains only the Android launcher/runtime integration and mobile controls. It does **not** distribute Hytale game files.

          Current development line: Alpha 0.8, with a standalone Android launcher inspired by the separation used by mobile Java launchers (launcher UI, scoped storage, runtime backend, graphics/input layer).

          The current client available to this project is a Windows x86-64 executable, so the Android backend still relies on a compatibility runtime while native alternatives are investigated.

          Migrated from the temporary `hytale-mobile` branch that had been created inside `better-xcloud-desktop.`. Hytale Mobile development now lives only in this repository.
          EOF

      - name: Commit migrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md hytale-mobile hytale-mobile-engine
          if git diff --cached --quiet; then
            echo 'Nothing to migrate.'
          else
            git commit -m 'Migrate Hytale Mobile sources to dedicated repository'
            git push origin main
          fi
